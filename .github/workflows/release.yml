name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true

      - name: Verify tag matches VERSION
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! -f VERSION ]]; then
            echo "::error::VERSION file is missing from the tagged commit."
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Invalid release tag '$RELEASE_TAG'. Use a tag such as v1.0.1."
            exit 1
          fi
          TAG_VERSION="${BASH_REMATCH[1]}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          FILE_VERSION="${FILE_VERSION#v}"

          echo "Release tag: $RELEASE_TAG"
          echo "Tag version: $TAG_VERSION"
          echo "VERSION file: $FILE_VERSION"

          if [[ -z "$FILE_VERSION" ]]; then
            echo "::error::VERSION file is empty."
            exit 1
          fi

          if [[ "$TAG_VERSION" != "$FILE_VERSION" ]]; then
            echo "::error::Release tag and VERSION do not match. Update VERSION to '$TAG_VERSION' in the tagged commit, or create a tag matching '$FILE_VERSION'."
            exit 1
          fi
          echo "Version check passed."

      - name: Run release checks
        run: |
          go test -race ./...
          go vet ./...
          bash ./scripts/smoke.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load release image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: omid-iran-bermuda:${{ github.ref_name }}

      - name: Run real Xray container integration test
        env:
          IMAGE_TAG: omid-iran-bermuda:${{ github.ref_name }}
        run: bash ./scripts/docker-smoke.sh

      - name: Build Linux and Windows binaries
        shell: bash
        run: |
          mkdir -p dist release
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/omid-iran-bermuda-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/omid-iran-bermuda-windows-amd64.exe ./cmd/server
          cp dist/omid-iran-bermuda-linux-amd64 release/

      - name: Build Windows local package
        shell: bash
        run: |
          mkdir -p release/windows/OMID-IRAN-BERMUDA/dist
          git archive HEAD | tar -x -C release/windows/OMID-IRAN-BERMUDA
          cp dist/omid-iran-bermuda-windows-amd64.exe release/windows/OMID-IRAN-BERMUDA/dist/
          (cd release/windows && zip -qr ../OMID-IRAN-BERMUDA-${GITHUB_REF_NAME}-Windows-Local.zip OMID-IRAN-BERMUDA)

      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha256sum omid-iran-bermuda-linux-amd64 "OMID-IRAN-BERMUDA-${GITHUB_REF_NAME}-Windows-Local.zip" > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OMID-IRAN BERMUDA ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            release/omid-iran-bermuda-linux-amd64
            release/OMID-IRAN-BERMUDA-${{ github.ref_name }}-Windows-Local.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
