name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(tr -d '\r\n' < VERSION)"
          test "$TAG_VERSION" = "$FILE_VERSION"

      - name: Run release checks
        run: |
          go test -race ./...
          go vet ./...
          bash ./scripts/smoke.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load release image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: omid-iran-bermuda:${{ github.ref_name }}

      - name: Run real Xray container integration test
        env:
          IMAGE_TAG: omid-iran-bermuda:${{ github.ref_name }}
        run: bash ./scripts/docker-smoke.sh

      - name: Build Linux and Windows binaries
        shell: bash
        run: |
          mkdir -p dist release
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/omid-iran-bermuda-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/omid-iran-bermuda-windows-amd64.exe ./cmd/server
          cp dist/omid-iran-bermuda-linux-amd64 release/

      - name: Build Windows local package
        shell: bash
        run: |
          mkdir -p release/windows/OMID-IRAN-BERMUDA/dist
          git archive HEAD | tar -x -C release/windows/OMID-IRAN-BERMUDA
          cp dist/omid-iran-bermuda-windows-amd64.exe release/windows/OMID-IRAN-BERMUDA/dist/
          (cd release/windows && zip -qr ../OMID-IRAN-BERMUDA-${GITHUB_REF_NAME}-Windows-Local.zip OMID-IRAN-BERMUDA)

      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha256sum omid-iran-bermuda-linux-amd64 "OMID-IRAN-BERMUDA-${GITHUB_REF_NAME}-Windows-Local.zip" > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OMID-IRAN BERMUDA ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            release/omid-iran-bermuda-linux-amd64
            release/OMID-IRAN-BERMUDA-${{ github.ref_name }}-Windows-Local.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
