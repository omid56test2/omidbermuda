name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source
        run: ./scripts/verify.sh
      - name: HTTP smoke test
        run: ./scripts/smoke.sh

  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build final image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: omid-iran-bermuda:1.0.1
      - name: Start image and verify real Xray runtime
        run: ./scripts/docker-smoke.sh

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Parse Windows PowerShell scripts
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content scripts/setup-windows.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content scripts/start-local-windows.ps1 -Raw))
      - name: Run native Windows tests
        run: go test ./...
      - name: Build Windows AMD64 executable
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags='-s -w' -o dist/omid-iran-bermuda-windows-amd64.exe ./cmd/server
