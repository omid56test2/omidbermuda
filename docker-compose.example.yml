services:
  omid-iran-bermuda:
    build: .
    image: omid-iran-bermuda:1.0.2
    container_name: omid-iran-bermuda
    init: true
    restart: unless-stopped
    stop_grace_period: 25s
    ports:
      # Keep the admin/Gateway port private on the host and put your own
      # TLS reverse proxy in front of it. Change HOST_BIND only intentionally.
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}"
      DATA_FILE: /app/data/omid_state.json
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}"
      XRAY_CONFIG: /app/data/xray-generated.json
      XRAY_BIN: /usr/local/bin/xray
      XRAY_AUTOSTART: "${XRAY_AUTOSTART:-true}"
      XRAY_AUTORESTART: "${XRAY_AUTORESTART:-true}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
    volumes:
      - omid-data:/app/data

volumes:
  omid-data:
